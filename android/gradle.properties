# --- KONFIGURASI MEMORY (Optimized for 32GB RAM) ---
# Xmx6G: 6GB Heap (Cukup banget, 8GB kadang overkill buat GC)
# MaxMetaspaceSize=1G: 1GB Metadata Class (4GB itu kebanyakan, mubazir)
# file.encoding=UTF-8: Mencegah error karakter aneh di Windows/Mac
org.gradle.jvmargs=-Xmx6G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=512m -Dfile.encoding=UTF-8

# --- PERFORMANCE BOOST ---
# Wajib ON kalau RAM/CPU Gede. Build jalan paralel di semua core CPU.
org.gradle.parallel=true

# Nyalakan cache biar build kedua/ketiga makin ngebut
org.gradle.caching=true

# Menjaga Daemon tetap hidup biar gak startup ulang terus (Default true, tapi ditegaskan aja)
org.gradle.daemon=true

# --- ANDROID CONFIG ---
android.useAndroidX=true
android.enableJetifier=true